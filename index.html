<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ranchos Rubinéia</title>
  <style>
    body {
      margin: 0;
      background: url('https://copilot.microsoft.com/th/id/BCO.48e023dc-a7f0-438f-aa40-f8b561c52ad1.png') no-repeat center center;
      background-size: cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
    h1 {
      font-size: 60px;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 36px;
      margin-bottom: 40px;
    }
    .btn {
      padding: 15px 40px;
      background-color: rgba(0,0,0,0.6);
      border: 2px solid #fff;
      border-radius: 10px;
      color: #fff;
      font-size: 22px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: rgba(255,255,255,0.2);
    }
    h1, h2 {
  color: #fff;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}
